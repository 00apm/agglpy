name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg                    # CI machines have no display
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash                      # same shell on Windows, Linux and macOS

jobs:
  lint:
    name: lint (ruff, import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pinned to the versions used locally; bump them deliberately
      - run: python -m pip install "ruff==0.16.7" "import-linter==2.15"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      # import-linter reads the package from the source tree; no
      # dependencies needed
      - run: python -m pip install -e . --no-deps
      - run: lint-imports

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # legacy modules are silenced in pyproject.toml (deleted in 2.9);
      # new code must be clean, so this job blocks
      - run: python -m pip install -e ".[typing]"
      - run: mypy src/agglpy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false               # every combination reports
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the system library OpenCV needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install agglpy with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Show versions (and fail early if a compiled package doesn't import)
        run: |
          python -c "import sys, numpy, pandas, scipy, skimage, cv2, matplotlib, tifffile
          print(sys.version)
          print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| scipy', scipy.__version__)
          print('scikit-image', skimage.__version__, '| opencv', cv2.__version__, '| matplotlib', matplotlib.__version__, '| tifffile', tifffile.__version__)"
      - name: Run the test suite (golden tests included)
        run: python -m pytest -ra

  min-versions:
    name: lowest versions (numpy ${{ matrix.numpy }})
    # Windows: the floors were verified there by hand (2026-10-01), so a
    # failure here means "version", not "platform"
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        numpy: ["1.24.4", "2.0.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install agglpy with every dependency at its floor
        run: python -m pip install -c .github/ci/min-versions.txt "numpy==${{ matrix.numpy }}" -e ".[test]"
      - name: Show versions
        run: python -m pip list
      - name: Run the test suite
        run: python -m pytest -ra
