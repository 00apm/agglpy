# Environment for agglpy v0.4.0, the last release with the Manager /
# settings.yml workflow. Exported 2026-10-01 from the author's working
# environment (Windows 64-bit, conda-forge), without build strings.
#
#   conda env create -f environment-v0.4.0.yml
#   conda activate agglpy-legacy
#   pip install --no-deps -e <checkout of tag v0.4.0>
#
# HCT results depend on the OpenCV version, so keep these versions when
# results must be reproduced exactly.
