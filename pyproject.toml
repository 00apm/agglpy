[project]
name = "agglpy"
description = "A tool for primary particle and agglomerate detection on digital images"
requires-python = ">=3.11.0"
version = "0.5.0.dev0"
authors = [{ name = "Artur Marchewicz", email = "amarchewicz@gmail.com" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
dependencies = [
    # NumPy 1.x and 2.x both work (full test suite, golden tests included).
    # The compiled packages below have floors at their first releases built
    # for NumPy 2; older wheels break when NumPy 2 is installed.
    # pandas stays below 3.0: copy-on-write became mandatory and
    # DataFrame.append was dropped - that needs its own migration.
    "numpy >= 1.24.4, < 3",
    "pandas >= 2.2.2, < 3",
    "opencv-python >= 4.10.0.84, < 5",
    "scipy >= 1.13, < 2",
    "scikit-image >= 0.24, < 1",
    "tifffile >= 2022.8.12",
    "matplotlib >= 3.8.4, < 4",
    "openpyxl >= 3.1.5, < 4",
    "pyyaml >= 6.0.2, < 7",
    # Round-trip YAML keeps the comments in agglpy.yml. Minor releases
    # of 0.x have broken the API: stop at the next one.
    "ruamel.yaml >= 0.18.6, < 0.20",
    "tqdm >= 4.66.5, < 5",
]

[project.optional-dependencies]
notebook = [
    "ipykernel >= 6.29.5",
    "ipywidgets >= 8.1.5, < 9",
    "plotly >= 6.1.1, < 7",
    # PyPI project is "kaleido", not "python-kaleido" (that's only the
    # conda-forge feedstock name) - the old pin was never pip-installable.
    # kaleido 1.x needs plotly>=6.1.1 and no longer bundles Chromium - run
    # `plotly_get_chrome` (or `python -c "import plotly.io as pio; pio.get_chrome()"`)
    # once in this env after install. That fetches a private, headless
    # Chromium for kaleido's own use; it does not touch the system default
    # browser (Firefox stays default).
    "kaleido >= 1.0, < 2",
    # not pulled in reliably by ipykernel/ipywidgets alone; without it
    # `fig.show()` in JupyterLab raises ValueError.
    "nbformat >= 5.9",
    # plotly's JupyterLab renderer is anywidget-based; without it fig.show()
    # produces the figure but nothing renders. Also needs jupyterlab_widgets
    # + anywidget installed in whatever env actually hosts the JupyterLab
    # server, if that's not this env - see conda_env_dev.yaml.
    "anywidget >= 0.9, < 1",
    # %matplotlib widget: agglpy's figures on a canvas that zooms. The
    # JupyterLab server's env needs the same ipympl version (its
    # frontend), else the canvas shows an error instead of the figure.
    "ipympl >= 0.9.8, < 0.10",
]
test = ["pytest >= 8.3.3, < 9", "pytest-regressions >= 2.5, < 3"]
typing = [
    "mypy >= 1.11.2, < 2",
    "pandas-stubs >= 2.1.1.230928, < 3",
    "types-openpyxl >= 3.1.5",
    "types-pyyaml >= 6.0.12.20240917",
    "types-tqdm >= 4.66.0.20240417",
]
lint = [
    "ruff >= 0.7.0, < 1",
    "import-linter >= 2.15, < 3",
    "numpydoc >= 1.11, < 2",
]
dist = ["tox >= 4.21.0, < 5"]
dev = ["agglpy[test,typing,lint,dist,notebook]"]

[tool.ruff]
line-length = 79            # PEP 8: max 79 for code
indent-width = 4

# Keep in sync with requires-python above.
target-version = "py311"

respect-gitignore = true

[tool.ruff.format]
quote-style = "double"      # PEP 8 has no preference; PEP 257 wants """docstrings"""
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
# Type annotations are checked by mypy (disallow_untyped_defs), not ruff
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings (includes W505)
    "F",    # pyflakes
    "I",    # isort: import order
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "T20",  # no print() in library code
    "D",    # docstrings: docs/contributing/docstrings.md
    "D417", # every parameter documented (off in the numpy convention)
]
ignore = [
    # Postponed to the docstring rewrite (roadmap 7.1): long strings,
    # comments and docstrings the formatter cannot wrap are fixed then
    "E501",
    "W505",
]

[tool.ruff.lint.per-file-ignores]
# Frozen legacy code (D-013), deleted in roadmap 2.9 together with these
# lines. New modules get PEP 8 names and no print() from the start.
"src/agglpy/_legacy/*" = ["N", "T20"]
"tests/legacy/*" = ["N"]
# The golden runner is rewritten on the new pipeline in 2.8.
"tests/golden/test_golden.py" = ["N"]
# Recipes are notebook-style scripts for users (D-045); they may print.
"examples/*" = ["T20", "D"]
# Test functions get no docstrings (pytest prints their names).
"tests/**" = ["D"]
"src/agglpy/_legacy/**" = ["D"]
# Transitional, while the docstrings are converted to numpydoc: a module
# leaves this list when its docstrings follow the standard.
"src/agglpy/app/__init__.py" = ["D"]
"src/agglpy/app/_analyze.py" = ["D"]
"src/agglpy/app/_collection.py" = ["D"]
"src/agglpy/app/_config.py" = ["D"]
"src/agglpy/app/_config_file.py" = ["D"]
"src/agglpy/app/_correction.py" = ["D"]
"src/agglpy/app/_detect.py" = ["D"]
"src/agglpy/app/_files.py" = ["D"]
"src/agglpy/app/_image.py" = ["D"]
"src/agglpy/app/_preview.py" = ["D"]
"src/agglpy/app/_records.py" = ["D"]
"src/agglpy/app/_report.py" = ["D"]
"src/agglpy/app/_results.py" = ["D"]
"src/agglpy/app/_sheet.py" = ["D"]
"src/agglpy/app/_sheet_writer.py" = ["D"]
"src/agglpy/app/_sources.py" = ["D"]
"src/agglpy/app/_status.py" = ["D"]
"src/agglpy/app/_work.py" = ["D"]
"src/agglpy/core/__init__.py" = ["D"]
"src/agglpy/core/_graph.py" = ["D"]
"src/agglpy/core/_grey_image.py" = ["D"]
"src/agglpy/core/_images.py" = ["D"]
"src/agglpy/core/agglomerates.py" = ["D"]
"src/agglpy/core/detect.py" = ["D"]
"src/agglpy/core/distributions.py" = ["D"]
"src/agglpy/core/metrics.py" = ["D"]
"src/agglpy/core/preprocess.py" = ["D"]
"src/agglpy/core/properties.py" = ["D"]
"src/agglpy/core/region.py" = ["D"]
"src/agglpy/core/structure.py" = ["D"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72         # PEP 8: 72 for comments and docstrings (W505)

[tool.ruff.lint.isort]
# test helpers (tests/support) and recipes (examples/), imported via
# pytest's pythonpath
known-local-folder = ["support", "examples"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# `numpydoc lint` (CI lint job): numpydoc's checks on the public API.
[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",  # extended summary: optional
    "SA01",  # See Also: optional
    "EX01",  # Examples: the recipes in examples/ are the examples
]
exclude = [
    '\._',  # private names, dunders; __init__ (params in the class)
    # names in private modules, except the ones a package exports
    '^_\w+\.(?!(Collection|Drawings|Image|ImageParams|Preview|Results|ImageResult|analyze|detect_particles)\b)',
]
# Properties have a noun-phrase summary and no Returns section.
override_RT01 = ['^(The|A|An|Whether) ']
exclude_files = [
    '.*_legacy',
    # Transitional, like ruff's per-file ignores above.
    "src/agglpy/app/__init__.py",
    "src/agglpy/app/_analyze.py",
    "src/agglpy/app/_collection.py",
    "src/agglpy/app/_config.py",
    "src/agglpy/app/_config_file.py",
    "src/agglpy/app/_correction.py",
    "src/agglpy/app/_detect.py",
    "src/agglpy/app/_files.py",
    "src/agglpy/app/_image.py",
    "src/agglpy/app/_preview.py",
    "src/agglpy/app/_records.py",
    "src/agglpy/app/_report.py",
    "src/agglpy/app/_results.py",
    "src/agglpy/app/_sheet.py",
    "src/agglpy/app/_sheet_writer.py",
    "src/agglpy/app/_sources.py",
    "src/agglpy/app/_status.py",
    "src/agglpy/app/_work.py",
    "src/agglpy/core/__init__.py",
    "src/agglpy/core/_graph.py",
    "src/agglpy/core/_grey_image.py",
    "src/agglpy/core/_images.py",
    "src/agglpy/core/agglomerates.py",
    "src/agglpy/core/detect.py",
    "src/agglpy/core/distributions.py",
    "src/agglpy/core/metrics.py",
    "src/agglpy/core/preprocess.py",
    "src/agglpy/core/properties.py",
    "src/agglpy/core/region.py",
    "src/agglpy/core/structure.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files live in subfolders without __init__.py (tests/README.md);
# helpers are imported from tests/ as `support.…`, recipes from the repo
# root as `examples.…`.
addopts = ["--import-mode=importlib"]
pythonpath = ["tests", "."]
markers = [
    "slow: runs on real images, takes seconds (deselect with -m 'not slow')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

# Legacy modules are frozen (D-013) and deleted in roadmap 2.9: mypy
# still reads them, but reports errors only in the code that stays.
[[tool.mypy.overrides]]
module = ["agglpy._legacy.*"]
ignore_errors = true

# SciPy ships no type information; scipy-stubs would have to follow the
# scipy version range (floor 1.13), so scipy objects are typed as Any.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# The notebook display's widget packages (ipympl: the user's optional
# install for %matplotlib widget) are not in the typing extra; ipympl
# and ipywidgets ship no type information.
[[tool.mypy.overrides]]
module = ["anywidget.*", "ipympl.*", "ipywidgets.*", "traitlets.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "agglpy"
include_external_packages = true

# A subpackage (agglpy.core, …) covers every module in it; a new
# top-level module is added to the first two contracts' source_modules
# (an edge module also to the edge contracts at the end).
[[tool.importlinter.contracts]]
name = "New code never imports the legacy modules (D-019)"
type = "forbidden"
source_modules = [
    "agglpy._notebook",
    "agglpy._yaml",
    "agglpy.app",
    "agglpy.core",
    "agglpy.draw",
    "agglpy.errors",
    "agglpy.export",
    "agglpy.io",
    "agglpy.logger",
    "agglpy.params",
    "agglpy.pipeline",
    "agglpy.tables",
]
forbidden_modules = ["agglpy._legacy"]

[[tool.importlinter.contracts]]
name = "Foundation, core, pipeline, io and export never import plotting or progress bars (rules 1, 4)"
type = "forbidden"
source_modules = [
    "agglpy._yaml",
    "agglpy.core",
    "agglpy.errors",
    "agglpy.export",
    "agglpy.io",
    "agglpy.logger",
    "agglpy.params",
    "agglpy.pipeline",
    "agglpy.tables",
]
forbidden_modules = ["matplotlib", "tqdm"]

# Edges sit beside the layers: application and frontends use them,
# foundation, core and pipeline never do (architecture section 2).
[[tool.importlinter.contracts]]
name = "Foundation, core and pipeline never import the edges"
type = "forbidden"
source_modules = [
    "agglpy._yaml",
    "agglpy.core",
    "agglpy.errors",
    "agglpy.logger",
    "agglpy.params",
    "agglpy.pipeline",
    "agglpy.tables",
]
forbidden_modules = [
    "agglpy._notebook",
    "agglpy.draw",
    "agglpy.export",
    "agglpy.io",
]

# io and export know file formats, not the analysis: they need only the
# foundation (draw needs the core's outline arcs).
[[tool.importlinter.contracts]]
name = "The io and export edges never import the core"
type = "forbidden"
source_modules = ["agglpy.export", "agglpy.io"]
forbidden_modules = ["agglpy.core"]

# Dependencies point down: the core never calls the layer above it.
[[tool.importlinter.contracts]]
name = "Foundation and core never import the pipeline"
type = "forbidden"
source_modules = [
    "agglpy._yaml",
    "agglpy.core",
    "agglpy.errors",
    "agglpy.logger",
    "agglpy.params",
    "agglpy.tables",
]
forbidden_modules = ["agglpy.pipeline"]

# Dependencies point down: only frontends use the application layer.
[[tool.importlinter.contracts]]
name = "Nothing below the application imports it"
type = "forbidden"
source_modules = [
    "agglpy._notebook",
    "agglpy._yaml",
    "agglpy.core",
    "agglpy.draw",
    "agglpy.errors",
    "agglpy.export",
    "agglpy.io",
    "agglpy.logger",
    "agglpy.params",
    "agglpy.pipeline",
    "agglpy.tables",
]
forbidden_modules = ["agglpy.app"]

# The YAML library may change: one module wraps it. Others use that
# module, so only direct imports are checked.
[[tool.importlinter.contracts]]
name = "Only agglpy._yaml imports ruamel"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agglpy._notebook",
    "agglpy.app",
    "agglpy.core",
    "agglpy.draw",
    "agglpy.errors",
    "agglpy.export",
    "agglpy.io",
    "agglpy.logger",
    "agglpy.params",
    "agglpy.pipeline",
    "agglpy.tables",
]
forbidden_modules = ["ruamel"]

[build-system]
requires = ["setuptools==69"]
build-backend = "setuptools.build_meta"
